<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-0: #0b0d14;
    --bg-1: #151827;
    --bg-2: #1d2136;
    --border: #2e3350;
    --silver: #cbd5e6;
    --silver-dim: #8b93ac;
    --sky: #7dd3fc;
    --gold: #e0b872;
    --danger: #f28b82;
  }

  * { box-sizing: border-box; }

  body {
    width: 480px;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    color: var(--silver);
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  header svg { flex: none; }

  .titles h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.15em;
    font-weight: 600;
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, var(--silver) 0%, var(--sky) 60%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .titles p {
    margin: 1px 0 0;
    font-size: 0.72em;
    color: var(--silver-dim);
    letter-spacing: 0.02em;
  }

  main { padding: 12px 16px 16px; }

  #subject {
    font-size: 0.85em;
    color: var(--silver-dim);
    background: rgba(125, 211, 252, 0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    overflow-wrap: break-word;
  }

  #subject::before {
    content: "Flagged message";
    display: block;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sky);
    margin-bottom: 3px;
  }

  label.field-label {
    display: block;
    font-size: 0.78em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--silver-dim);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    height: 220px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95em;
    line-height: 1.4;
    resize: vertical;
    background: var(--bg-0);
    color: var(--silver);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea:focus {
    border-color: var(--sky);
    box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.15);
  }

  textarea::placeholder { color: #565c78; }

  button#submit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 10px;
    padding: 10px 14px;
    font-size: 0.95em;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #0b0d14;
    background: linear-gradient(90deg, var(--sky) 0%, var(--silver) 100%);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  button#submit:hover:not(:disabled) { filter: brightness(1.08); }
  button#submit:active:not(:disabled) { transform: translateY(1px); }

  button#submit:disabled {
    cursor: default;
    background: var(--bg-2);
    color: var(--silver-dim);
  }

  #status {
    font-size: 0.85em;
    color: var(--silver-dim);
    margin-top: 10px;
    min-height: 1.4em;
    overflow-wrap: break-word;
  }

  #status.ok { color: #86e7b8; }
  #status.err { color: var(--danger); }
</style>
</head>
<body>
  <header>
    <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#cbd5e6"/>
          <stop offset="60%" stop-color="#7dd3fc"/>
          <stop offset="100%" stop-color="#e0b872"/>
        </linearGradient>
      </defs>
      <line x1="24" y1="8" x2="24" y2="40" stroke="url(#wingGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M24 40c-4 0-7-3-7-7 4 0 7 2 7 5 0-3 3-5 7-5 0 4-3 7-7 7z" fill="url(#wingGrad)"/>
      <path d="M24 12c-3-3-4-6-3-9 3 1 5 3 5 6 1-3 3-5 6-6 1 3 0 6-3 9-2-1-3-1-5 0z" fill="url(#wingGrad)"/>
      <path d="M13 15c-2-4-1-8 1-10 2 2 3 5 2 8-1-1-2-1-3 2z" fill="url(#wingGrad)" opacity="0.9"/>
      <path d="M35 15c2-4 1-8-1-10-2 2-3 5-2 8 1-1 2-1 3 2z" fill="url(#wingGrad)" opacity="0.9"/>
      <circle cx="24" cy="24" r="3.6" fill="none" stroke="url(#wingGrad)" stroke-width="1.6"/>
    </svg>
    <div class="titles">
      <h1>Mercury</h1>
      <p>Flag this message for handling</p>
    </div>
  </header>
  <main>
    <div id="subject"></div>
    <label class="field-label" for="instruction">Instruction</label>
    <textarea id="instruction" placeholder="How should this message, and similar ones, be handled going forward? Write as much as you need - this isn't limited to one sentence."></textarea>
    <button id="submit">
      <svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="24" y1="8" x2="24" y2="40" stroke="#0b0d14" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 40c-4 0-7-3-7-7 4 0 7 2 7 5 0-3 3-5 7-5 0 4-3 7-7 7z" fill="#0b0d14"/>
        <path d="M24 12c-3-3-4-6-3-9 3 1 5 3 5 6 1-3 3-5 6-6 1 3 0 6-3 9-2-1-3-1-5 0z" fill="#0b0d14"/>
      </svg>
      Send to Mercury
    </button>
    <div id="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
