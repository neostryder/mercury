services:
  mercury:
    build: .
    restart: unless-stopped
    ports:
      - "8720:8720"
    environment:
      - MERCURY_SHARED_SECRET=${MERCURY_SHARED_SECRET}
      - BILBO_CLASSIFIER_URL=${BILBO_CLASSIFIER_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MERCURY_TELEGRAM_CHAT_ID=${MERCURY_TELEGRAM_CHAT_ID}
      - LOREMASTER_GATEWAY_URL=${LOREMASTER_GATEWAY_URL}
      - LOREMASTER_GATEWAY_SECRET=${LOREMASTER_GATEWAY_SECRET}
    volumes:
      - ./data:/data
