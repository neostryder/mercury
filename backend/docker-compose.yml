services:
  mercury:
    build: .
    restart: unless-stopped
    ports:
      - "8720:8720"
    environment:
      - MERCURY_SHARED_SECRET=${MERCURY_SHARED_SECRET}
      - MERCURY_WORKER_LOG_URL=${MERCURY_WORKER_LOG_URL}
      - MERCURY_MAILBOX_IMAP_USER=${MERCURY_MAILBOX_IMAP_USER}
      - MERCURY_MAILBOX_IMAP_PASSWORD=${MERCURY_MAILBOX_IMAP_PASSWORD}
      - MERCURY_DELIVER_ACCEPTED_MAIL=${MERCURY_DELIVER_ACCEPTED_MAIL:-false}
      - MERCURY_RULES_LEDGER_PATH=/data/rules_ledger.json
      - MERCURY_IDENTITIES_PATH=/data/identities.json
      - PROMPT_INJECTION_CLASSIFIER_URL=${PROMPT_INJECTION_CLASSIFIER_URL}
      - AGENT_GATEWAY_URL=${AGENT_GATEWAY_URL}
      - AGENT_GATEWAY_SECRET=${AGENT_GATEWAY_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MERCURY_DASHBOARD_USER=${MERCURY_DASHBOARD_USER}
      - MERCURY_DASHBOARD_PASSWORD=${MERCURY_DASHBOARD_PASSWORD}
      - MERCURY_DIGEST_SMTP_USER=${MERCURY_DIGEST_SMTP_USER}
      - MERCURY_DIGEST_SMTP_PASSWORD=${MERCURY_DIGEST_SMTP_PASSWORD}
    volumes:
      - ./data:/data
